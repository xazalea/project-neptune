[package]
name = "neptune-kernel"
version = "0.1.0"
edition = "2021"
authors = ["Neptune Unikernel Team"]
description = "Browser-based WASM unikernel for proxy routing"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.87"
js-sys = "0.3.64"
web-sys = { version = "0.3.64", features = [
  "console",
  "Window",
  "Document",
  "Location",
  "HtmlElement",
  "HtmlCollection",
  "Node",
  "NodeList",
  "Element",
  "MessageEvent",
  "ErrorEvent",
  "DomParser",
  "SupportedType",
  "XmlSerializer",
] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
regex = "1.10"
once_cell = "1.19"
console_error_panic_hook = "0.1"
tl = "0.7"
url = "2.5"
base64 = "0.22"
smoltcp = { version = "0.11", default-features = false, features = [
  "alloc", "medium-ethernet", "proto-ipv4", "proto-ipv6",
  "socket-tcp", "socket-udp", "socket-icmp", "socket-dns", "socket-dhcpv4",
  "socket-raw", "proto-dns", "proto-dhcpv4", "async"
] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
